<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
  <title>Universal DB Workbench</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #252529; color: #fff; font: 14px/1.4 -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      border: 1px solid #3a3a40; box-sizing: border-box; -webkit-app-region: drag; user-select: none;
    }
    svg { width: 64px; height: 64px; }
    h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
    p { margin: 0; font-size: 11px; color: #9a9aa3; letter-spacing: .12em; text-transform: uppercase; }
    .bar { position: relative; width: 180px; height: 3px; margin-top: 10px; background: #3a3a40; overflow: hidden; }
    .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: #fff; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
  </style>
</head>
