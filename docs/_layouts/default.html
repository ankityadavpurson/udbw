<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Main">
        {% for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <a href="{{ site.repo }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {% if page.url != '/' %}<h1>{{ page.title }}</h1>{% endif %}
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        MIT licensed · <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a> ·
        <a href="{{ '/code-signing/' | relative_url }}">Code signing policy</a> ·
        <a href="{{ site.repo }}/issues">Report an issue</a>
      </p>
    </div>
  </footer>
</body>
</html>
