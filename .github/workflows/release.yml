name: Release

# Every push to main works out the next version from the Conventional Commit messages since the latest v* tag:
#   feat!: / fix!: / a "BREAKING CHANGE:" footer  -> major     feat: -> minor     fix: / perf: / revert: -> patch
# Other types (docs, chore, refactor, test, ci, style, build) do not release by themselves. The first release uses the
# version in package.json. The version job tags the commit, then installers are built for every platform and attached
# to a draft GitHub release that you publish by hand. package.json is not edited: the version is injected at build time.
# Pushing a tag such as v0.2.0 by hand also works and releases exactly that version.
# Signing is optional: without the secrets below the installers are built unsigned.
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD     Windows code-signing certificate (.pfx, base64 or URL) and its password
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD     macOS "Developer ID Application" certificate (.p12, base64 or URL) and password
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   macOS notarization
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            version=$(node -p "require('./package.json').version")
            echo "No earlier release: using package.json version $version"
          else
            bump=none
            for sha in $(git rev-list "$last..HEAD"); do
              subject=$(git log -1 --format=%s "$sha")
              body=$(git log -1 --format=%b "$sha")
              if echo "$subject" | grep -Eq '^[a-z]+(\([^)]*\))?!:' || echo "$body" | grep -Eq '^BREAKING[ -]CHANGE:'; then bump=major
              elif echo "$subject" | grep -Eq '^feat(\([^)]*\))?:'; then [ "$bump" = major ] || bump=minor
              elif echo "$subject" | grep -Eq '^(fix|perf|revert)(\([^)]*\))?:'; then [ "$bump" = none ] && bump=patch || true
              fi
            done
            if [ "$bump" = none ]; then
              echo "No feat/fix/perf/breaking commits since $last; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
            echo "$bump bump from $last"
          fi
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          # Tags pushed with GITHUB_TOKEN do not start another workflow run.
          git tag "v$version" && git push origin "v$version"

  release:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build:ui
      - name: Package and publish
        # The publish settings make electron-builder write app-update.yml, which turns on in-app updates.
        run: npx electron-builder --publish always -c.extraMetadata.version=${{ needs.version.outputs.version }} -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
